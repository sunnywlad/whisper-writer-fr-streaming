misc:
  hide_status_window: false
  noise_on_completion: false
  print_to_terminal: true
model_options:
  api:
    api_key: null
    base_url: https://api.openai.com/v1
    model: whisper-1
  common:
    initial_prompt: "Transcription d'instructions techniques de développement\
      \ web et blockchain. Noms propres : Claude, Claude Code, Anthropic, Merion,\
      \ MRN, Alyra, Le Wagon, Foundry, Solidity, Ethereum, Hermes. Vocabulaire : IA,\
      \ intelligence artificielle, métadonnées, tokenomique, portfolio,\
      \ readme, WhisperWriter, DeFi, TradFi, smart contract, dApp."
    language: fr
    temperature: 0.0
  local:
    engine: parakeet
    parakeet_model_dir: models/sherpa-onnx-nemo-parakeet-tdt-0.6b-v3-int8
    parakeet_hotwords_file: hotwords.txt
    parakeet_hotwords_score: 2.0
    beam_size: 1
    best_of: 1
    compute_type: int8
    condition_on_previous_text: true
    cpu_threads: 4
    device: cpu
    model: small
    model_path: null
    vad_filter: true
  use_api: false
post_processing:
  add_trailing_space: true
  input_method: dotool
  remove_capitalization: false
  remove_trailing_period: false
  writing_key_press_delay: 0.005
recording_options:
  activation_key: f9
  backlog_warning_seconds: 15
  buffer_trimming_seconds: 10
  input_backend: evdev
  max_buffer_seconds: 20
  max_segment_duration: 30
  min_chunk_seconds: 2.0
  min_duration: 100
  recording_mode: continuous
  sample_rate: 16000
  silence_duration: 700
  sound_device: null
  tail_flush_seconds: 4
  use_streaming: true
